<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRO 行业调研报告</title><style>html,body{margin:0;width:100%;height:100%;background:#f3f6f8}#status{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#345;padding:24px;text-align:center}iframe{border:0;width:100%;height:100vh;display:none}</style></head><body><div id="status">正在加载 CRO 行业调研报告…</div><iframe id="report" title="CRO 行业调研报告"></iframe><script>(async()=>{try{const names=Array.from({length:12},(_,i)=>`chunks/chunk-${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const blob=new Blob([parts.join('')],{type:'text/html;charset=utf-8'});const f=document.getElementById('report');f.src=URL.createObjectURL(blob);f.onload=()=>{document.getElementById('status').remove();f.style.display='block'};}catch(e){document.getElementById('status').textContent='报告加载失败，请刷新页面重试。';console.error(e)}})();</script></body></html>
